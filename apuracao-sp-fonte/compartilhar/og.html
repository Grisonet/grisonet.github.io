<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Inter+Tight:wght@700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;background:#080808;overflow:hidden}
body{position:relative;color:#fff;font-family:Inter,system-ui,sans-serif;padding:56px 72px}
body::before{content:"";position:absolute;right:-260px;top:-300px;width:900px;height:900px;
  background:radial-gradient(closest-side,rgba(255,76,0,.32),rgba(255,194,0,.08) 55%,transparent)}
body::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px}
.z{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:18px}
.top img{height:44px}
.chip{background:#FFC200;color:#080808;font:800 17px "Inter Tight";letter-spacing:.04em;padding:7px 12px;border-radius:8px;text-transform:uppercase}
.live{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 18px;font:700 17px Inter;letter-spacing:.08em;text-transform:uppercase}
.live i{width:12px;height:12px;border-radius:50%;background:#FF4C00;box-shadow:0 0 0 6px rgba(255,76,0,.22)}
h1{margin-top:60px;font:800 84px/1.02 "Inter Tight";letter-spacing:-.035em;max-width:1000px}
h1 mark{background:#FFC200;color:#080808;padding:0 14px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{margin-top:24px;font:500 34px/1.3 Inter;color:#d6d4d0}
.sub b{color:#fff;font-weight:700}
.cta{position:absolute;left:72px;bottom:56px;display:flex;align-items:center;gap:22px}
.btn{background:#FF4C00;color:#080808;font:800 36px "Inter Tight";letter-spacing:-.02em;padding:16px 28px;border-radius:16px}
.url{font:600 24px Inter;color:#a9a6a1}
.bar{position:absolute;right:72px;bottom:74px;width:250px}
.bar .t{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:4px}
.bar .t span:first-child{flex:51;background:#FFC200;border-radius:99px}
.bar .t span:last-child{flex:49;background:#FF4C00;border-radius:99px}
.bar .k{display:flex;justify-content:space-between;margin-top:10px;font:600 15px Inter;color:#8d8a85;letter-spacing:.06em;text-transform:uppercase}
</style></head>
<body>
<div class="z top">
  <img src="logo.svg" alt="GR Data"><span class="chip">Apuração 2026</span>
  <span class="live"><i></i>Ao vivo · 2º turno</span>
</div>
<h1 class="z">Acompanhe a apuração em <mark>tempo real</mark> aqui</h1>
<p class="z sub">com dados <b>direto do TSE</b>.</p>
<div class="z cta"><span class="btn">Saiba quem ganhou antes!</span><span class="url">apuracao.grisodata.com.br</span></div>
</body></html>
